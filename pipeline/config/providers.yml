# Provider registry. Adding, removing or disabling a model is a change to this file only —
# never to the code. Every enabled candidate writes the same brief; the judge picks between them.

candidates:
  # Claude Code, headless. Tools are disabled explicitly: this is a writer, not an agent.
  # It authenticates from the host's stored credentials, or CLAUDE_CODE_OAUTH_TOKEN for
  # unattended runs (see .env.example).
  - id: claude
    enabled: true
    adapter: cli
    output: claude_json
    timeout_s: 420
    command:
      - claude
      - "-p"
      - "--output-format"
      - "json"
      - "--disallowed-tools"
      - "Bash,Read,Write,Edit,NotebookEdit,WebFetch,WebSearch,Glob,Grep,Task,TodoWrite"

  # Amazon Bedrock, signed with the task role — no API key exists for this, anywhere. Bedrock
  # speaks the OpenAI wire format on bedrock-runtime, so adding a model here really is YAML
  # only: no binary in the image, no credential to rotate, nothing that expires mid-run.
  #
  # This replaced `codex` and `grok` CLI entries. Both needed a binary in the image and a second
  # credential to keep alive; neither vendor turned out to be reachable from this account anyway.
  #
  # The "us." prefix selects a system-defined cross-region inference profile rather than the bare
  # foundation model. AWS predefines these — there is nothing to create. Bedrock then routes each
  # call to whichever constituent region has capacity, roughly 3x the single-region quota, at the
  # same on-demand rate with no routing or data-transfer surcharge. A job that gets one attempt a
  # day at 06:15 should not lose it to a throttle.
  #
  # Everything here was checked against the account rather than the vendor announcements:
  #   aws bedrock list-inference-profiles --query "inferenceProfileSummaries[].inferenceProfileId"
  # GLM, gpt-oss, Grok, Qwen and Kimi are all announced for Bedrock and none of them is present
  # in us-east-1 here. Verify before adding, not after.

  # ~$0.61/month. Meta lineage, so it disagrees with Claude — which is the whole point of running
  # two writers. Cheap for the wrong-looking reason: a mixture-of-experts model activates a
  # fraction of its weights, so output is $0.80/M against Claude Haiku's $5.00, and output is
  # 54% of this bill.
  - id: llama
    enabled: false # flip to true once the IAM grant is applied
    adapter: openai_compatible
    auth: sigv4
    base_url: "https://bedrock-runtime.${AWS_REGION}.amazonaws.com/v1"
    model: "us.meta.llama4-maverick-17b-instruct-v1:0"
    timeout_s: 420

  # Present in the account and considered, so the comparison is not redone every quarter.
  # Cost is one writer at one run a day: ~14k input, ~16.5k output.
  #
  #   Llama 4 Scout     Meta      same family as Maverick — a second Meta model adds cost
  #                               without adding disagreement, which is what fan-out buys
  #   Nova Pro          Amazon    plausible; price unconfirmed at time of writing
  #   Nova Micro/Lite   Amazon    cheapest available, but small — better as the judge, which
  #                               is a reading task, than as a writer
  #   DeepSeek R1       DeepSeek  ~$1.35/$5.40 => ~$3.28/mo, and it is a reasoning model: the
  #                               visible chain of thought inflates output well past the 16.5k
  #                               this estimate assumes, against a 420s timeout
  #   Palmyra X5        Writer    ~$0.60/$6.00 => ~$3.27/mo. Documented as suited to
  #                               retrieval-heavy rather than generation-heavy work, which is
  #                               precisely backwards for a writer
  #   Nova Premier      Amazon    $2.50/$12.50 — flagship pricing for a job a small model does
  #   Claude Opus/Sonnet 5        capable and unnecessary: Claude already writes one candidate,
  #                               on a flat subscription rather than per token

# The judge only runs when two or more candidates succeed — with one writer there is nothing
# to choose between, and a fabricated score is worse than none.
#
# On Bedrock rather than Ollama. The scheduled task runs on Fargate, which has no Ollama and no
# OLLAMA_BASE_URL, so the previous configuration would have failed the moment a second candidate
# was enabled — silently, because a failed judge falls back to the first candidate and still
# publishes. Fan-out would have cost three writers and bought no judging at all.
#
# Scoring is a reading task; a small model does it adequately and the whole pass is roughly
# 50k input and 2k output tokens a day. Keep OLLAMA_BASE_URL working for local runs by pointing
# this at Ollama in a local providers.yml override if you want to judge without spending.
judge:
  enabled: true
  adapter: openai_compatible
  auth: sigv4
  base_url: "https://bedrock-runtime.${AWS_REGION}.amazonaws.com/v1"
  # Nova Lite v1, not Nova 2 Lite — the newer name is 10x the output rate for a task that is
  # mostly reading. ~$0.11/month. If its picks look poor, Claude Haiku 4.5 is the upgrade at
  # about $1.71/month more; the judge decides what actually gets printed, so it is the one
  # place worth spending up.
  model: "us.amazon.nova-lite-v1:0"
  timeout_s: 300
  temperature: 0.0

# Publish as long as this many candidates produced a valid edition.
min_candidates: 1
