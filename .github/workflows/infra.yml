name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.10.6
  # Account-, repo- and domain-specific values are not in the repo. The repo name comes from
  # the workflow context; the rest come from repository variables and secrets.
  #
  # Every input the root module reads must be listed here. A variable that exists locally but
  # not in CI does not merely drift — it makes CI compute a *smaller* configuration, and an
  # -auto-approve apply then deletes whatever the missing value was keeping alive.
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_domain_name: ${{ vars.SITE_DOMAIN }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
  TF_VAR_claude_token_parameter: ${{ vars.CLAUDE_TOKEN_PARAMETER }}
  TF_VAR_runner_timezone: ${{ vars.RUNNER_TIMEZONE }}
  # Personal, so secrets rather than variables: GitHub masks a secret everywhere it appears.
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_sec_user_agent: ${{ secrets.SEC_USER_AGENT }}

  # Referenced, not used. The runner redacts a registered secret wherever it appears in a log,
  # including inside a larger string — so naming it here masks the account id in every role ARN
  # and bucket name these jobs print, without a masking step.
  #
  # An ::add-mask:: step cannot do this: the runner echoes a step's script before running it,
  # so a script containing ${{ vars.…ROLE_ARN }} prints the ARN, and the account id with it, one
  # line before the mask exists. That is exactly how the previous two attempts failed.
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/prod
    env:
      # GitHub withholds secrets from Dependabot-triggered runs. Without them the root module
      # evaluates a smaller configuration, so the plan proposes deleting whatever those inputs
      # sustain — and prints the current values, read back from state, into a public log. That
      # is how an email address reached one. A dependency bump has no business planning
      # infrastructure, so the AWS half is skipped and the job passes on its static checks
      # alone, which keeps the required check reporting instead of hanging.
      SKIP_AWS: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      # persist-credentials: false — this workflow runs pull-request code (fmt, tests, plan),
      # and a checkout that leaves the job's token in .git/config puts it within reach of that
      # code. Nothing here pushes, so the credential has no reason to persist.
      # Pinned to a commit, not a tag: a tag is mutable, and this job holds an OIDC token that
      # can assume an AWS role. Dependabot keeps the pin current — it rewrites both the SHA and
      # the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Format check
        run: tofu fmt -check -recursive ../..

      - name: Lambda handler tests
        run: python3 tests/test_handler.py
        working-directory: infra/modules/api

      # Dependabot gets a real check, not just a formatting pass: validate needs an initialised
      # directory, and -backend=false initialises providers and modules without touching remote
      # state or needing credentials.
      - name: Init without the backend
        if: env.SKIP_AWS == 'true'
        run: tofu init -backend=false

      # Skipped for Dependabot along with the rest of the AWS path, so no AWS-audience token is
      # ever requested on a run that has no business assuming a role.
      #
      # Residual, stated rather than hidden: `id-token: write` is a static job permission, so a
      # Dependabot run is still *able* to mint one. The role it could reach is the read-only
      # plan role, and fork pull requests get no id-token at all. Removing the capability
      # outright means splitting this into two jobs, which would change which check is required
      # and reopen the "required check never reports" trap that this pull request exists to fix.
      - name: Show OIDC subject claim
        if: env.SKIP_AWS != 'true'
        run: |
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | jq -R 'split(".") | .[1] | @base64d | fromjson | {sub, aud, repository, event_name}'

      - uses: aws-actions/configure-aws-credentials@v6
        if: env.SKIP_AWS != 'true'
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_TOFU_PLAN_ROLE_ARN || vars.AWS_TOFU_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Values reach the shell through env rather than being interpolated into the script, so
      # nothing repository-controlled is expanded into executable text.
      - name: Init
        if: env.SKIP_AWS != 'true'
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: tofu init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"

      # Ungated: both paths have initialised by now, and a configuration error should fail a
      # dependency bump too.
      - run: tofu validate

      - if: env.SKIP_AWS != 'true'
        run: tofu plan -no-color -out=tfplan

      # A summary, not the plan. The full plan lists every ARN, endpoint and policy document,
      # and a comment on a public pull request is a permanent, indexable place to publish them.
      - name: Comment the plan summary
        if: github.event_name == 'pull_request' && env.SKIP_AWS != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('node:child_process');
            const plan = JSON.parse(
              execSync('tofu show -json tfplan', { cwd: 'infra/envs/prod', maxBuffer: 256 * 1024 * 1024 }).toString(),
            );
            const changes = (plan.resource_changes || []).filter(c => !c.change.actions.includes('no-op'));
            const of = action => changes.filter(c => c.change.actions.includes(action)).map(c => c.address);
            const [created, updated, deleted] = [of('create'), of('update'), of('delete')];
            const section = (title, list) =>
              list.length ? `\n**${title} (${list.length})**\n${list.map(a => `- \`${a}\``).join('\n')}\n` : '';
            const body = deleted.length
              ? `### tofu plan\n\n> [!WARNING]\n> This plan **deletes ${deleted.length} resource(s)**. Apply will refuse unless \`ALLOW_DESTROY\` is set.\n`
                + section('Delete', deleted) + section('Create', created) + section('Update', updated)
              : `### tofu plan\n\n${changes.length ? '' : 'No changes.\n'}`
                + section('Create', created) + section('Update', updated);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      # persist-credentials: false — this workflow runs pull-request code (fmt, tests, plan),
      # and a checkout that leaves the job's token in .git/config puts it within reach of that
      # code. Nothing here pushes, so the credential has no reason to persist.
      # Pinned to a commit, not a tag: a tag is mutable, and this job holds an OIDC token that
      # can assume an AWS role. Dependabot keeps the pin current — it rewrites both the SHA and
      # the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # This job declares an environment, so its subject claim names the environment rather
      # than the branch — a different claim from the plan job above, and worth seeing.
      - name: Show OIDC subject claim
        run: |
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | jq -R 'split(".") | .[1] | @base64d | fromjson | {sub, aud, environment}'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TOFU_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: tofu init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"

      # Planned here rather than reusing the plan job's file: that job may have run under the
      # read-only role, and a plan is only as good as the state it locked.
      - name: Plan
        run: tofu plan -no-color -out=tfplan

      # The guard. An unattended apply must never delete infrastructure because an input went
      # missing: a variable that is absent in CI silently shrinks the configuration, and
      # -auto-approve then executes the difference. This turns that into a red build.
      #
      # To delete something deliberately, set the ALLOW_DESTROY repository variable to "true",
      # merge, then unset it.
      - name: Refuse to destroy
        run: |
          deletions=$(tofu show -json tfplan | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')
          echo "resources this plan would delete: $deletions"
          if [ "$deletions" -gt 0 ]; then
            tofu show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "  - \(.address)"'
            if [ "${{ vars.ALLOW_DESTROY }}" != "true" ]; then
              echo "::error::Refusing to apply: this plan deletes $deletions resource(s). If that is intended, set the ALLOW_DESTROY repository variable to 'true' for one run."
              exit 1
            fi
            echo "::warning::ALLOW_DESTROY is set — applying a plan that deletes $deletions resource(s)."
          fi

      # Applies the plan that was just checked, so what ships is exactly what was inspected.
      - run: tofu apply -auto-approve tfplan
