name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  # No path filter on pull requests: these checks are required to merge, and a required check
  # that is filtered out never reports at all — it sits pending forever and blocks the pull
  # request instead of passing it. (A check that *runs and skips* is fine: GitHub counts
  # successful, skipped and neutral alike for required checks.)
  pull_request:
  workflow_dispatch:

# Least privilege at the top, opted into per job. Only the job that talks to AWS gets
# id-token: write; the static job that runs pull-request code does not, so that code has no
# ACTIONS_ID_TOKEN_REQUEST_* to mint a JWT from.
permissions:
  contents: read

# One shared group serialised every branch, and GitHub keeps only ONE run queued per group:
# a third arrival cancels the one already waiting. cancel-in-progress: false protects the
# running job, not the queued one. So opening two pull requests seconds apart cancelled the
# older one's plan, and because `plan` is a required check the pull request was then blocked
# on a check that would never report — no red X, nothing to click, just a gap.
#
# Pull requests now get a group each. They only ever plan, and a plan writes nothing, so there
# is nothing to serialise between them. main keeps the single shared group, because apply does
# mutate state and two of those must never overlap.
concurrency:
  group: infra-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.10.6
  # Account-, repo- and domain-specific values are not in the repo. The repo name comes from
  # the workflow context; the rest come from repository variables and secrets.
  #
  # Every input the root module reads must be listed here. A variable that exists locally but
  # not in CI does not merely drift — it makes CI compute a *smaller* configuration, and an
  # -auto-approve apply then deletes whatever the missing value was keeping alive.
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_domain_name: ${{ vars.SITE_DOMAIN }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
  TF_VAR_claude_token_parameter: ${{ vars.CLAUDE_TOKEN_PARAMETER }}
  TF_VAR_runner_timezone: ${{ vars.RUNNER_TIMEZONE }}
  # Personal, so secrets rather than variables: GitHub masks a secret everywhere it appears.
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_sec_user_agent: ${{ secrets.SEC_USER_AGENT }}

  # Referenced, not used. The runner redacts a registered secret wherever it appears in a log,
  # including inside a larger string — so naming it here masks the account id in every role ARN
  # and bucket name these jobs print, without a masking step.
  #
  # An ::add-mask:: step cannot do this: the runner echoes a step's script before running it,
  # so a script containing ${{ vars.…ROLE_ARN }} prints the ARN, and the account id with it, one
  # line before the mask exists. That is how two earlier attempts failed.
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  # Static checks. Runs for everything, including Dependabot, and holds no AWS capability at
  # all: no id-token, no credentials, nothing to exchange. This is the job that executes
  # pull-request code — formatting, the Lambda tests, `tofu validate` — so it is the one that
  # must not be able to mint an OIDC token.
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      # persist-credentials: false — nothing here pushes, and leaving the job token in
      # .git/config would put it within reach of the pull-request code this job runs.
      # Pinned to a commit rather than a tag: a tag is mutable. Dependabot keeps the pin
      # current, rewriting the SHA and the trailing comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Format check
        run: tofu fmt -check -recursive ../..

      - name: Lambda handler tests
        run: python3 tests/test_handler.py
        working-directory: infra/modules/api

      # -backend=false resolves providers and modules without touching remote state or needing
      # credentials, which is what makes a real validation possible in a job with no AWS access.
      - name: Init without the backend
        run: tofu init -backend=false

      - run: tofu validate

  # Everything that needs AWS. Skipped for Dependabot, which is what removes the capability
  # rather than merely declining to use it: a skipped job's permissions are never granted.
  # A skipped required check counts as passing, so this stays a required check without
  # blocking dependency bumps.
  plan-aws:
    if: github.actor != 'dependabot[bot]'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # Prints only the identifying claims, never the token. GitHub is moving the subject claim
      # to a form that embeds numeric ids, and a mismatch surfaces as an opaque
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity" from the next step.
      - name: Show OIDC subject claim
        run: |
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | jq -R 'split(".") | .[1] | @base64d | fromjson | {sub, aud, repository, event_name}'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event_name == 'pull_request' && vars.AWS_TOFU_PLAN_ROLE_ARN || vars.AWS_TOFU_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Values reach the shell through env rather than being interpolated into the script, so
      # nothing repository-controlled is expanded into executable text.
      - name: Init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: tofu init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"

      # Pull-request plans no longer queue behind each other, so they would now contend for the
      # state lock instead — trading a silently cancelled check for a red one. A plan writes no
      # state, so it does not need the lock: -lock=false lets any number of them read at once.
      # The apply job keeps locking, which is where it actually matters.
      #
      # The flag arrives through env rather than being interpolated into the script, matching
      # the Init step above.
      - name: Plan
        env:
          LOCK_FLAG: ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}
        run: tofu plan -no-color -out=tfplan $LOCK_FLAG

      # A summary, not the plan. The full plan lists every ARN, endpoint and policy document,
      # and a comment on a public pull request is a permanent, indexable place to publish them.
      - name: Comment the plan summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('node:child_process');
            const plan = JSON.parse(
              execSync('tofu show -json tfplan', { cwd: 'infra/envs/prod', maxBuffer: 256 * 1024 * 1024 }).toString(),
            );
            const changes = (plan.resource_changes || []).filter(c => !c.change.actions.includes('no-op'));

            // Report a replacement as one thing, not as a deletion and a creation of the same
            // address. Listing it twice is how a routine ECS revision came to read as "this
            // plan deletes a resource" — which is a different and much more alarming claim.
            const is = (c, ...a) => a.every(x => c.change.actions.includes(x));
            const replaced = changes.filter(c => is(c, 'delete', 'create')).map(c => c.address);
            const rest = changes.filter(c => !is(c, 'delete', 'create'));
            const only = action => rest.filter(c => c.change.actions.includes(action)).map(c => c.address);
            const [created, updated, deleted] = [only('create'), only('update'), only('delete')];

            const section = (title, list) =>
              list.length ? `\n**${title} (${list.length})**\n${list.map(a => `- \`${a}\``).join('\n')}\n` : '';
            const warning = deleted.length
              ? `> [!WARNING]\n> This plan **deletes ${deleted.length} resource(s)**. Apply will refuse unless \`ALLOW_DESTROY\` is set.\n`
              : '';
            const body = `### tofu plan\n\n` + warning
              + (changes.length ? '' : 'No changes.\n')
              + section('Delete', deleted) + section('Replace', replaced)
              + section('Create', created) + section('Update', updated);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: plan-aws
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # This job declares an environment, so its subject claim names the environment rather
      # than the branch — a different claim from the plan job above, and worth seeing.
      - name: Show OIDC subject claim
        run: |
          token=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | jq -R 'split(".") | .[1] | @base64d | fromjson | {sub, aud, environment}'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TOFU_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: tofu init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$REGION"

      # Planned here rather than reusing the plan job's file: that job may have run under the
      # read-only role, and a plan is only as good as the state it locked.
      - name: Plan
        run: tofu plan -no-color -out=tfplan

      # The guard. An unattended apply must never delete infrastructure because an input went
      # missing: a variable that is absent in CI silently shrinks the configuration, and
      # -auto-approve then executes the difference. This turns that into a red build.
      #
      # To delete something deliberately, set the ALLOW_DESTROY repository variable to "true",
      # merge, then unset it.
      - name: Refuse to destroy
        run: |
          json=$(tofu show -json tfplan)

          # A deletion and a replacement are not the same event, and the first version of this
          # guard treated them as one — so a routine ECS task-definition revision, which is
          # always delete+create, read as "this plan deletes a resource" and blocked the apply.
          #
          # The failure this guard exists to catch is an input that is set locally but missing
          # in CI: the root module then evaluates a *smaller* configuration and -auto-approve
          # executes the difference. That always appears as a resource leaving the plan
          # entirely — actions == ["delete"], nothing else. A replacement means the resource is
          # still configured and an immutable attribute changed, which is ordinary.
          deletions=$(echo "$json" | jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length')
          replacements=$(echo "$json" | jq '[.resource_changes[]? | select((.change.actions | index("delete")) and (.change.actions | index("create")))] | length')

          echo "resources this plan would delete outright: $deletions"
          echo "resources this plan would replace:         $replacements"

          if [ "$replacements" -gt 0 ]; then
            echo "$json" | jq -r '.resource_changes[]? | select((.change.actions | index("delete")) and (.change.actions | index("create"))) | "  ~ \(.address)"'
          fi

          # Replacing something that holds data is a different matter: the resource survives in
          # the configuration but its contents do not. Those types are named rather than
          # inferred, so adding a stateful resource to this stack is a deliberate decision about
          # whether it belongs here too.
          stateful=$(echo "$json" | jq -r '
            [ .resource_changes[]?
              | select((.change.actions | index("delete")) and (.change.actions | index("create")))
              | select(.type | test("^aws_(s3_bucket|dynamodb_table|db_instance|rds_cluster|efs_file_system|elasticache_cluster)$"))
              | .address ] | .[]')

          if [ "$deletions" -gt 0 ]; then
            echo "$json" | jq -r '.resource_changes[]? | select(.change.actions == ["delete"]) | "  - \(.address)"'
          fi

          if [ -n "$stateful" ]; then
            echo "::error::Refusing to apply: this plan replaces a resource that holds data:"
            echo "$stateful" | while read -r a; do echo "::error::  $a"; done
          fi

          if [ "$deletions" -gt 0 ] || [ -n "$stateful" ]; then
            if [ "${{ vars.ALLOW_DESTROY }}" != "true" ]; then
              echo "::error::Refusing to apply. If this is intended, set the ALLOW_DESTROY repository variable to 'true' for one run, then unset it."
              exit 1
            fi
            echo "::warning::ALLOW_DESTROY is set — applying a plan that destroys data or removes resources."
          fi

      # Applies the plan that was just checked, so what ships is exactly what was inspected.
      - run: tofu apply -auto-approve tfplan
