name: security-scan

# Covers what CodeQL cannot: infrastructure-as-code and the container image.
#
# CodeQL has no analyzer for HCL or Dockerfiles, so the OpenTofu configuration — which is where
# a mistake exposes a bucket or over-grants a role — would otherwise be unscanned. Trivy is
# open source and free; results are uploaded as SARIF so they appear alongside CodeQL alerts in
# the Security tab rather than being buried in a job log.

on:
  push:
    branches: [main]
    paths: ["infra/**", "pipeline/**", ".github/workflows/security-scan.yml"]
  # No path filter on pull requests. These checks are required to merge, and a required check
  # that is filtered out never reports at all — it sits pending forever and blocks the pull
  # request instead of passing it.
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: infrastructure
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The scan itself never decides the outcome. Trivy's own `exit-code` is unreliable when
      # the output format is SARIF — it reported failure here with zero findings, and locally
      # it reported success *with* findings — so the pass/fail decision is made below from the
      # report, which is the artefact that actually says what was found.
      - name: Scan the OpenTofu configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: trivy-infra.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-infra.sarif
          category: trivy-infra

      # The gate. Findings fail the job; the three accepted today are listed in .trivyignore
      # with the reasoning, so this blocks on anything *new* rather than on a backlog — a check
      # that is always red teaches people to ignore it.
      # Severity is read from the report, not from the scan flags: Trivy's SARIF export ignores
      # `--severity` and includes low findings regardless, so filtering here is what actually
      # sets the bar. 4.0 is the bottom of MEDIUM on the SARIF scale (low is 2.0).
      - name: Fail on any finding at medium or above
        run: |
          filter='[ .runs[] as $r | $r.results[]? | .ruleId as $id
                    | ($r.tool.driver.rules[] | select(.id == $id)
                       | (.properties["security-severity"] // "0") | tonumber)
                    | select(. >= 4) ] | length'
          count=$(jq "$filter" trivy-infra.sarif)
          total=$(jq '[.runs[].results[]?] | length' trivy-infra.sarif)
          echo "findings: $count at medium or above, $total including low"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]? | "  \(.ruleId): \(.message.text)"' trivy-infra.sarif
            echo "::error::$count infrastructure finding(s) at medium or above. Fix them, or accept one in .trivyignore with a written reason."
            exit 1
          fi

  image:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Builds for the host architecture only — this is a vulnerability scan of the layers,
      # not the release build, so emulating arm64 would only make it slower.
      - name: Build the pipeline image
        run: docker build -t pipeline-scan:ci pipeline

      # Only fixable CRITICAL/HIGH vulnerabilities count: an unpatched CVE in a base image is
      # not something a merge can resolve, so blocking on it would just stop all work.
      - name: Scan it
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: pipeline-scan:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Reported, not enforced — the one check here that does not block a merge, deliberately.
      #
      # Every vulnerability this finds is inside the writer CLI's vendored npm tree: nothing
      # this repository writes, nothing the pipeline calls, and nothing a pull request can fix.
      # Worse, the set changes between builds, so an accepted-findings list is stale as soon as
      # it is written — CI and a local build of the same Dockerfile reported different CVE ids
      # on the same day.
      #
      # A required check that the author of a change cannot turn green does not improve
      # security; it trains people to merge past red. The findings still upload to the Security
      # tab, where they are visible and triageable, and the weekly schedule keeps them current.
      - name: Report image vulnerabilities
        run: |
          filter='[ .runs[] as $r | $r.results[]? | .ruleId as $id
                    | ($r.tool.driver.rules[] | select(.id == $id)
                       | (.properties["security-severity"] // "0") | tonumber)
                    | select(. >= 7) ] | length'
          count=$(jq "$filter" trivy-image.sarif)
          total=$(jq '[.runs[].results[]?] | length' trivy-image.sarif)
          echo "vulnerabilities: $count at high or above, $total including lower"
          jq -r '.runs[].results[]? | "  \(.ruleId): \(.message.text)"' trivy-image.sarif | head -40
          if [ "$count" -gt 0 ]; then
            echo "::warning::$count high/critical vulnerability(ies) in the image, all within the writer CLI's vendored dependencies. See the Security tab."
          fi

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Blocks a pull request that *introduces* a known-vulnerable dependency, which is the one
      # case worth failing on: it is cheap to fix before merge and tedious afterwards.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
